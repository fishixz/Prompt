name: Rocha Ticket Bot CI

on:
  push:
    paths:
      - 'rocha-ticket-bot/**'
      - '.github/workflows/rocha-ticket-bot.yml'
  pull_request:
    paths:
      - 'rocha-ticket-bot/**'
      - '.github/workflows/rocha-ticket-bot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rocha-ticket-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and component self-tests
        run: npm run check
